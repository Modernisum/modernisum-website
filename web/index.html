<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A Product of [Your Company/App Name]">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Your App Name">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="shortcut icon" type="image/x-xicon" href="favicon.ico"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>

  <title>Modern school</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
     * SPLASH SCREEN STYLES
     * These styles create the initial splash screen with the "hello" animation.
     */
    body {
      margin: 0;
      overflow: hidden; /* Hide scrollbars during splash */
      background-color: #f0f0f0; /* Or your app's main background color */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif; /* A simple fallback font */
      color: #333; /* Default body text color */
    }

    #flutter_splash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #ffffff; /* White background for the splash */
      transition: opacity 0.5s ease-out; /* Smooth fade-out when Flutter loads */
      z-index: 9999; /* Ensure it's on top */
    }

    #flutter_splash.hidden {
      opacity: 0;
      pointer-events: none; /* Prevent clicks on the hidden splash */
    }

    .splash-text {
      font-size: 64px; /* Larger font for "hello" */
      font-weight: bold;
      opacity: 0; /* Start invisible */
      animation: fadeIn 1.5s ease-in-out forwards; /* Apply fade-in animation */
      animation-delay: 0.5s; /* Delay the start of "hello" animation */

      /* --- MODIFICATION HERE: Gradient for text (yellow changed to orange) --- */
      background: linear-gradient(to right, orange, brown); /* The gradient itself */
      -webkit-background-clip: text; /* Clip the background to the text shape */
      background-clip: text; /* Standard property */
      -webkit-text-fill-color: transparent; /* Make text transparent to show clipped background */
      /* --- END MODIFICATION --- */
    }

    /* .splash-subtext style is no longer needed if the div is removed */
    /*
    .splash-subtext {
        font-size: 28px;
        font-style: italic;
        opacity: 0;
        margin-top: 10px;
        animation: fadeIn 1.5s ease-in-out forwards;
        animation-delay: 1.5s;
        color: white;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
    }
    */

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="flutter_splash">
    <div class="splash-text">hello</div>
    </div>

  <script>
    var serviceWorkerVersion = '{{flutter_service_worker_version}}';
    var scriptLoaded = false;

    function loadMainDartJs() {
      if (scriptLoaded) {
        return;
      }
      scriptLoaded = true;
      var scriptTag = document.createElement('script');
      scriptTag.src = 'main.dart.js';
      scriptTag.type = 'application/javascript';
      document.body.append(scriptTag);
    }

    // Function to hide the splash screen
    function hideSplashScreen() {
      const splash = document.getElementById('flutter_splash');
      if (splash) {
        splash.classList.add('hidden'); // Add a class to trigger fade-out
        // Optional: Remove the splash element completely after transition for cleanup
        splash.addEventListener('transitionend', () => {
          splash.remove();
          document.body.style.overflow = 'auto'; // Restore scrollbars
        }, { once: true });
      }
    }

    // Listen for the custom event from Flutter app indicating it's ready
    window.addEventListener('flutter-first-frame', hideSplashScreen);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        var serviceWorkerUrl = 'flutter_service_worker.js?v=' + serviceWorkerVersion;
        navigator.serviceWorker.register(serviceWorkerUrl)
          .then((reg) => {
            function waitForActivation(serviceWorker) {
              serviceWorker.addEventListener('statechange', () => {
                if (serviceWorker.state == 'activated') {
                  console.log('Installed new service worker.');
                  loadMainDartJs();
                }
              });
            }
            if (!reg.active && (reg.installing || reg.waiting)) {
              waitForActivation(reg.installing || reg.waiting);
            } else if (!reg.active.scriptURL.endsWith(serviceWorkerVersion)) {
              console.log('New service worker available.');
              reg.update();
              waitForActivation(reg.installing);
            } else {
              console.log('Loading app from service worker.');
              loadMainDartJs();
            }
          });

        setTimeout(() => {
          if (!scriptLoaded) {
            console.warn(
              'Failed to load app from service worker. Falling back to plain <script> tag.',
            );
            loadMainDartJs();
          }
        }, 4000);
      });
    } else {
      loadMainDartJs();
    }
  </script>
</body>
</html>
